# 011-tools — task contract fragment
task: tools
script: bin/tools.sh
flags: []
apt_set: [btop, httpie, chafa, xclip, bat, jq, curl, tar, ca-certificates, lsof]
github_installs:
  - {repo: "jesseduffield/lazygit", binary: lazygit, kind: tarball, arch: "Linux_<go_arch>"}
  - {repo: "jesseduffield/lazydocker", binary: lazydocker, kind: tarball, arch: "Linux_<go_arch>"}
  - {repo: "derailed/k9s", binary: k9s, kind: tarball, arch: "Linux_<rust_arch>"}
  - {repo: "unkn0wn-root/resterm", binary: resterm, kind: binary, pattern: "resterm_Linux_"}
file_effects:
  - {path: "~/.local/bin/<tool>", action: install-if-missing, mode: "0755"}
idempotency: PATH-or-dest presence probe per tool
