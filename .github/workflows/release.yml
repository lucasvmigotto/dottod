name: release

# Tag-triggered release of the scripts tarball + checksums.
# Tags look like `1.0.0` (plain SemVer, no `v` prefix, per git:workflow).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts tarball
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5cb0e671cc3f5d003215d9d7e4617 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage release artifacts
        run: |
          V="${GITHUB_REF_NAME}"
          tar -czf "dottod-scripts-${V}.tar.gz" bin config scripts
          sha256sum "dottod-scripts-${V}.tar.gz" > "dottod-${V}-sha256sums.txt"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            "dottod-scripts-${VERSION}.tar.gz" \
            "dottod-${VERSION}-sha256sums.txt" \
            --title "$VERSION" \
            --generate-notes

          gh release view "$VERSION" --json body -q .body > release-notes.md
          {
            echo
            echo "## Checksums (SHA256)"
            echo '```text'
            cat "dottod-${VERSION}-sha256sums.txt"
            echo '```'
          } >> release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md
