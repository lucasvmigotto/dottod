name: shell

on:
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    paths:
      - "bin/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/shell.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh, shellcheck and bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh shellcheck bats
          bats --version

      - name: Bash syntax check
        # NB: tests/*.bats are intentionally absent here — `@test` is not
        # valid bash, so `bash -n` cannot parse them. ShellCheck below
        # understands .bats natively and covers them instead.
        # (tests/test-*.sh suites were migrated to BATS; no such files exist.)
        run: |
          for f in \
            bin/*.sh \
            scripts/system-info.sh scripts/.alias.sh scripts/.bat.utils.sh \
            scripts/.sys.utils.sh scripts/.xclip.utils.sh \
            scripts/.container.utils.sh scripts/nvim-headless-check.sh \
            tests/run.sh; do
            bash -n "${f}"
          done

      - name: Zsh syntax check
        run: |
          zsh -n scripts/.sysinfo.prompt.sh
          zsh -n config/.custom.zshrc
          zsh -n tests/test-spaceship-sysinfo.zsh
          zsh -n tests/test-container.zsh

      - name: ShellCheck (warnings are errors)
        # NB: shellcheck has no zsh dialect, so the zsh sources
        # (scripts/.sysinfo.prompt.sh, config/.custom.zshrc, tests/*.zsh)
        # are intentionally absent here; they are covered by `zsh -n`
        # above and by the zsh test suite below.
        run: |
          shellcheck -S warning \
            bin/*.sh \
            scripts/system-info.sh scripts/.alias.sh scripts/.bat.utils.sh \
            scripts/.sys.utils.sh scripts/.xclip.utils.sh \
            scripts/.container.utils.sh scripts/nvim-headless-check.sh \
            tests/run.sh tests/test-*.bats tests/helpers.bash

      - name: Tests
        run: ./tests/run.sh
