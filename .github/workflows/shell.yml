name: shell

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "config/.custom.bashrc"
      - "config/.custom.vimrc"
      - "config/.nerdtree.vimrc"
      - "config/.gitconfig"
      - "config/.ssh.config"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/shell.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (just, shellcheck, bats, shfmt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq just shellcheck bats shfmt
          just --version && bats --version

      - name: Check (syntax, lint, format)
        # File lists live in the justfile — this step just runs them.
        # NB: tests/*.bats are absent from `bash -n` (`@test` is not valid
        # bash); ShellCheck understands .bats natively and covers them.
        run: just check

      - name: Tests
        run: just test

      - name: Release-logic tests
        run: just release

  userland:
    # The suites on userlands unlike the dev host: Alpine (BusyBox awk, sed,
    # date, mktemp, realpath) and Debian (mawk). Images pinned in distros.sh.
    name: Userland (${{ matrix.distro }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian]
    steps:
      - uses: actions/checkout@v4

      - name: Podman
        run: |
          command -v podman >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman uidmap
          }
          podman --version

      - name: Ensure rootless subuids
        run: |
          if ! grep -q -- "^${USER}:" /etc/subuid 2>/dev/null \
            || ! grep -q -- "^${USER}:" /etc/subgid 2>/dev/null; then
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "${USER}"
          fi

      - name: Suites on ${{ matrix.distro }}
        # Large runner: no memory/cpu caps.
        run: DOT_IT_PODMAN_ARGS='' ./tests/integration/userland.sh ${{ matrix.distro }}
